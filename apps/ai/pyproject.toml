[project]
name = "vidyam-ai"
version = "0.1.0"
description = "Vidyam AI engine: ingestion, retrieval, generation and verification. The only service that calls LLMs, embedding models and the vector database."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "datamodel-code-generator==0.86.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidyam_ai"]

[tool.pyright]
include = ["src"]
exclude = ["src/vidyam_ai/generated"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# The uv workspace keeps one virtualenv at the repo root.
venvPath = "../.."
venv = ".venv"
