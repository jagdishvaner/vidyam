# Git hooks (installed by `pnpm install` via the root `prepare` script).
# Hooks only touch staged files and stay fast; full lint/typecheck/test runs in CI through turbo.
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml,css}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    ruff:
      glob: "*.py"
      run: uv run --frozen --package vidyam-ai ruff check --force-exclude --fix {staged_files} && uv run --frozen --package vidyam-ai ruff format --force-exclude {staged_files}
      stage_fixed: true
    # Each file is linted with its own package's ESLint config (layer rules, Next.js rules, AI-SDK ban).
    eslint:
      glob: "{apps,packages}/**/*.{ts,tsx}"
      run: pnpm exec node scripts/eslint-staged.mjs {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
