# Vidyam local infrastructure. Apps (web/api/ai/render) run on the host with `pnpm dev`.
#
# Port block 38000–38190, bound to 127.0.0.1 only (not reachable from the network):
#   38000 app entry (Caddy)     38130 PostgreSQL      38140/38141 Qdrant HTTP/gRPC
#   38150 Temporal (gRPC)       38151 Valkey (cache)  38152 Temporal UI
#   38160/38161 SeaweedFS S3/admin UI
# Host apps: 38100 web, 38110 api, 38120 ai, 38170 render health, 38190 Drizzle Studio.
#
# Credentials below are local-development values only; .env.example documents the same ones.
name: vidyam

services:
  postgres:
    image: postgres:17.11-bookworm # match the RDS PostgreSQL major version
    container_name: vidyam-postgres
    environment:
      POSTGRES_USER: vidyam
      POSTGRES_PASSWORD: vidyam
      POSTGRES_DB: vidyam
    ports:
      - "127.0.0.1:38130:5432"
    volumes:
      - pg:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyam -d vidyam"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: vidyam-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: vidyam-local-qdrant-key # same auth model as production
    ports:
      - "127.0.0.1:38140:6333"
      - "127.0.0.1:38141:6334"
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; /readyz needs no API key.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 2s
      timeout: 3s
      retries: 30

  # Temporal: durable workflows for long, multi-step work (ADR 0013). Stores everything in the Postgres above.
  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    container_name: vidyam-temporal-schema
    depends_on:
      postgres: { condition: service_healthy }
    environment: &temporal-db
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: vidyam
      POSTGRES_PWD: vidyam
      SQL_PASSWORD: vidyam
    volumes:
      - ./temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    restart: "no"

  temporal:
    image: temporalio/server:1.32.1
    container_name: vidyam-temporal
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:38150:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 2s
      timeout: 3s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    container_name: vidyam-temporal-namespace
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NAMESPACE: vidyam
    volumes:
      - ./temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.55.0
    container_name: vidyam-temporal-ui
    # Also tells `compose up --wait` that the namespace step is meant to exit.
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: vidyam
    ports:
      - "127.0.0.1:38152:8080"

  valkey-cache:
    image: valkey/valkey:8.1.10-alpine
    container_name: vidyam-valkey-cache
    # Caches, rate limits, resumable SSE streams: evict least-recently-used keys, no persistence.
    command:
      - "valkey-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "127.0.0.1:38151:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: vidyam-seaweedfs
    # All-in-one master + volume + filer + S3 gateway. Buckets are created by the S3 bootstrap (Phase 1).
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:38160:8333"
      - "127.0.0.1:38161:9333"
    volumes:
      - s3:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 3s
      timeout: 3s
      retries: 40

  caddy:
    image: caddy:2.11.7-alpine
    container_name: vidyam-caddy
    # One origin per app, like CloudFront in production: /api/* → NestJS, everything else → that app's Next.js.
    environment:
      # Host apps (`pnpm dev`) by default; `pnpm stack:up` points these at the app containers.
      WEB_UPSTREAM: ${VIDYAM_WEB_UPSTREAM:-host.docker.internal:38100}
      ADMIN_UPSTREAM: ${VIDYAM_ADMIN_UPSTREAM:-host.docker.internal:38102}
      API_UPSTREAM: ${VIDYAM_API_UPSTREAM:-host.docker.internal:38110}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:38000:80" # teachers' app
      - "127.0.0.1:38001:81" # admin panel
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/__caddy/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ── Apps as containers (`pnpm stack:up`), the same images that run on AWS ────────────────────────────
  # Not published on host ports: Caddy (:38000, :38001) is the only way in, exactly like CloudFront in production.
  # Secrets come from the repo-root .env; service addresses use the compose network.
  api:
    profiles: [full]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    image: vidyam/api:local
    env_file: ../../.env
    environment: &app-network-env
      VIDYAM_DATABASE_URL: postgresql://vidyam_app:vidyam_app_local@postgres:5432/vidyam
      VIDYAM_TEMPORAL_ADDRESS: temporal:7233
      VIDYAM_CACHE_REDIS_URL: redis://valkey-cache:6379
      VIDYAM_QDRANT_URL: http://qdrant:6333
      VIDYAM_S3_ENDPOINT: http://seaweedfs:8333
      VIDYAM_AI_INTERNAL_URL: http://ai:38120
      VIDYAM_API_INTERNAL_URL: http://api:38110
    depends_on: &app-depends
      postgres: { condition: service_healthy }
      temporal-namespace: { condition: service_completed_successfully }
      valkey-cache: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:38110/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  ai:
    profiles: [full]
    build: { context: ../.., dockerfile: infra/docker/ai.Dockerfile }
    image: vidyam/ai:local
    env_file: ../../.env
    environment: *app-network-env
    depends_on: *app-depends
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:38120/livez')",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  ai-worker:
    profiles: [full]
    image: vidyam/ai:local
    command: ["vidyam-ai", "worker"]
    env_file: ../../.env
    environment: *app-network-env
    depends_on:
      ai: { condition: service_healthy }

  web:
    profiles: [full]
    build:
      context: ../..
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: web, PORT: "38100" }
    image: vidyam/web:local
    env_file: ../../.env
    environment:
      VIDYAM_API_INTERNAL_URL: http://api:38110
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:38100/en/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  admin:
    profiles: [full]
    build:
      context: ../..
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: admin, PORT: "38102" }
    image: vidyam/admin:local
    env_file: ../../.env
    environment:
      VIDYAM_API_INTERNAL_URL: http://api:38110
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:38102/en/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pg:
  qdrant:
  s3:
