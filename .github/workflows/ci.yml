name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Optional turbo remote cache; without these, turbo uses its local cache only.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json#packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - name: Formatting
        run: pnpm exec prettier --check .
      - name: Lint, typecheck, unit tests (TypeScript + Python)
        run: pnpm turbo run lint typecheck test
      - name: Generated code is committed and up to date
        # The OpenAPI export validates the API's environment; the example values are enough (nothing connects).
        run: |
          cp .env.example .env
          pnpm codegen
          git status --porcelain
          test -z "$(git status --porcelain)"

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: cp .env.example .env
      - name: Start local infrastructure (same compose file as development)
        run: pnpm infra:up
      - name: Build workspace packages
        run: pnpm turbo run build
      - name: Migrate the development and test databases
        run: pnpm db:migrate
      - name: Create S3 buckets and Qdrant collections
        run: pnpm bootstrap
      - run: pnpm test:integration
      - name: Python tables match the migrated schema (no TypeScript/Python drift)
        run: |
          pnpm --filter @vidyam/ai codegen:db
          git diff --exit-code -- apps/ai/src/vidyam_ai/infrastructure/db/generated
      - name: Infrastructure logs on failure
        if: failure()
        run: pnpm infra:ps && docker compose -f infra/docker/compose.yml logs --tail=200
